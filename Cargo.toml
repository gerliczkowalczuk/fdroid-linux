[package]
name = "fdroid-linux"
version = "0.1.0"
edition = "2024"
authors = ["Oskar Gerlicz-Kowalczuk <oskar@gerlicz.space>"]
description = "Ultra-lightweight Android/F-Droid compatibility layer & native application runner for Linux"
license = "GPL-3.0-or-later"
repository = "https://github.com/gerliczkowalczuk/fdroid-linux"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", features = ["json"] }
zip = "2.2"
nix = { version = "0.29", features = ["fs", "process", "sched"] }
tempfile = "3.10"
log = "0.4"
env_logger = "0.11"
